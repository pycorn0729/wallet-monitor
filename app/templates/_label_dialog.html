{# Shared add/edit label dialog. Openers may carry data-address / data-label / data-note to prefill it. #}
<dialog id="label-dialog" class="modal" aria-labelledby="label-dialog-title">
  <form method="post" action="/labels" class="stack">
    <div class="modal-head">
      <h2 id="label-dialog-title">Label an address</h2>
      <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
    </div>
    <label>Address (SS58) <input name="address" required class="mono" placeholder="5..." value="{{ prefill or '' }}"></label>
    <label>Label <input name="label" required maxlength="128" placeholder="e.g. Binance hot wallet" autofocus></label>
    <label>Note <textarea name="note" rows="2" placeholder="Optional details"></textarea></label>
    <p class="small muted">Saving a label for an address that already has one replaces it.</p>
    <div class="modal-foot">
      <button type="button" data-close>Cancel</button>
      <button class="primary">Save label</button>
    </div>
  </form>
</dialog>
<script>
  // Prefill the label dialog from the button that opened it.
  document.addEventListener("click", (ev) => {
    const b = ev.target.closest('[data-dialog="label-dialog"]');
    if (!b) return;
    const f = document.querySelector("#label-dialog form");
    if (b.hasAttribute("data-label-new")) { f.reset(); return; }
    if (b.dataset.address) f.address.value = b.dataset.address;
    f.label.value = b.dataset.label || "";
    f.note.value = b.dataset.note || "";
  }, true);
  {% if prefill %}document.getElementById("label-dialog").showModal();{% endif %}
</script>
